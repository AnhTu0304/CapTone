services:
  # ==========================================
  # Database Service: PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: captone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-captone_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-captone_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - captone-network

  # ==========================================
  # Backend Service: Main_backend (Node.js MVC)
  # ==========================================
  main-backend:
    build:
      context: ./Main_backend
      dockerfile: Dockerfile
    container_name: captone-main-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      API_PREFIX: /api/v1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-captone_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_development_only}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "5000:5000"
    networks:
      - captone-network

# ==========================================
# Volumes & Networks
# ==========================================
volumes:
  postgres_data:
    driver: local

networks:
  captone-network:
    driver: bridge
