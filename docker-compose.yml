services:
  # ==========================================
  # Database Service: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: captone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-captone_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-captone_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - captone-network

  # ==========================================
  # Cache / Session Blacklist / Email Queue: Redis 7
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: captone-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-dev_local_redis_password_change_me}" ]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"${REDIS_PASSWORD:-dev_local_redis_password_change_me}\" redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - captone-network

  # ==========================================
  # Core Backend: Node.js Express TypeScript MVC
  # ==========================================
  main-backend:
    build:
      context: ./Main_backend
      dockerfile: Dockerfile
    container_name: captone-main-backend
    restart: unless-stopped
    env_file:
      - ./Main_backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      BACKEND_HOST_PORT: ${BACKEND_PORT:-5005}
      AI_HOST_PORT: ${AI_PORT:-8005}
      DB_HOST_PORT: ${DB_PORT:-5433}
      REDIS_HOST_PORT: ${REDIS_HOST_PORT:-6380}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_local_redis_password_change_me}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-300}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      NODE_ENV: ${NODE_ENV:-development}
      API_PREFIX: /api/v1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-captone_db}
      AI_BACKEND_URL: http://ai-backend:8000
      AI_INTERNAL_HMAC_SECRET: ${AI_INTERNAL_HMAC_SECRET:-dev_only_ai_internal_hmac_secret_32_characters_long}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-dev_only_totp_encryption_key_minimum_32_characters}
      JWT_SECRET: ${JWT_SECRET:-dev_only_jwt_secret_key_minimum_32_characters_long_12345}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8090,http://localhost:3000,http://localhost:3001,http://localhost:3005,http://127.0.0.1:8090,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3005,http://demo.giahungtrieu.net:8090,http://112.78.1.150:8090}
      CLIENT_URL: ${CLIENT_URL:-http://demo.giahungtrieu.net:8090}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-selfheal-backend}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-1.0.0}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-selfheal-system}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_METRIC_EXPORT_INTERVAL_MS: ${OTEL_METRIC_EXPORT_INTERVAL_MS:-15000}
      K8S_NAMESPACE_NAME: ${K8S_NAMESPACE_NAME:-selfheal-system}
      K8S_POD_NAME: ${K8S_POD_NAME:-captone-main-backend}
      K8S_NODE_NAME: ${K8S_NODE_NAME:-minikube}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5005}:5000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/v1/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - captone-network

  # ==========================================
  # AI Backend: FastAPI GRU & Multi-Agent RCA
  # ==========================================
  ai-backend:
    build:
      context: ./AI_backend
      dockerfile: Dockerfile
    container_name: captone-ai-backend
    restart: unless-stopped
    env_file:
      - path: ./AI_backend/.env
        required: false
    environment:
      PORT: 8000
      APP_ENV: ${APP_ENV:-development}
      AI_INTERNAL_HMAC_SECRET: ${AI_INTERNAL_HMAC_SECRET:-dev_only_ai_internal_hmac_secret_32_characters_long}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: selfheal-ai-service
      OTEL_SERVICE_VERSION: "1.0.0"
      OTEL_SERVICE_NAMESPACE: selfheal-system
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_METRIC_EXPORT_INTERVAL_MS: ${OTEL_METRIC_EXPORT_INTERVAL_MS:-15000}
      K8S_NAMESPACE_NAME: selfheal-system
      K8S_POD_NAME: captone-ai-backend
      K8S_NODE_NAME: minikube
    volumes:
      - ./AI_backend/saved_models:/app/saved_models
    # Internal-only: accessible via Docker network from main-backend
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - captone-network

  # ==========================================
  # Frontend: React 19 Greptile Blueprint UI
  # ==========================================
  selfheal-frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: selfheal_platform_web
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3005}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - captone-network

  # ==========================================
  # Installer Service: FastAPI Agent Distribution
  # ==========================================
  installer-service:
    build:
      context: ./Agent/installer_service
      dockerfile: Dockerfile
    container_name: captone-installer-service
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 8100
      HOST: 0.0.0.0
      APP_ENV: production
      AGENT_VERSION: "1.0.0"
      DOCKER_IMAGE: "captone-agent:1.0.0"
    ports:
      - "127.0.0.1:${INSTALLER_PORT:-8105}:8100"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - captone-network

  # ==========================================
  # Reverse Proxy: Nginx Gateway (SSL & Routing)
  # ==========================================
  nginx-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: captone-reverse-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - main-backend
      - installer-service
      - selfheal-frontend
      - ai-backend
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
      - "127.0.0.1:${WEB_HTTPS_PORT:-8443}:443"
    volumes:
      - ${EDGE_CERTS_DIR:-./certs/edge}:/etc/nginx/certs:ro
    networks:
      - captone-network
  # ==========================================
  # Volumes & Networks
  # ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  captone-network:
    driver: bridge
