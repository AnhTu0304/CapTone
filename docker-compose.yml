version: '3.8'

services:
  selfheal-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: selfheal_platform_web
    restart: always
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
