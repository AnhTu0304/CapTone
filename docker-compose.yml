services:
  # ==========================================
  # Database Service: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: captone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-captone_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-captone_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - captone-network

  # ==========================================
  # Cache / Session Blacklist / Email Queue: Redis 7
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: captone-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - captone-network

  # ==========================================
  # Core Backend: Node.js Express TypeScript MVC
  # ==========================================
  main-backend:
    build:
      context: ./Main_backend
      dockerfile: Dockerfile
    container_name: captone-main-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-300}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      NODE_ENV: production
      API_PREFIX: /api/v1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-captone_db}
      AI_BACKEND_URL: http://ai-backend:8000
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_development_only}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - captone-network

  # ==========================================
  # AI Backend: FastAPI GRU & Multi-Agent RCA
  # ==========================================
  ai-backend:
    build:
      context: ./AI_backend
      dockerfile: Dockerfile
    container_name: captone-ai-backend
    restart: unless-stopped
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - captone-network

  # ==========================================
  # Frontend: React 19 Greptile Blueprint UI
  # ==========================================
  selfheal-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: selfheal_platform_web
    restart: always
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - captone-network

  # ==========================================
  # Installer Service: FastAPI Agent Distribution
  # ==========================================
  installer-service:
    build:
      context: ./Agent/installer_service
      dockerfile: Dockerfile
    container_name: captone-installer-service
    restart: unless-stopped
    environment:
      PORT: 8100
      HOST: 0.0.0.0
      APP_ENV: production
      AGENT_VERSION: "1.0.0"
      DOCKER_IMAGE: "ghcr.io/captone-ai/captone-agent:1.0.0"
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - captone-network

  # ==========================================
  # Reverse Proxy: Nginx Gateway (SSL & Routing)
  # ==========================================
  nginx-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: captone-reverse-proxy
    restart: unless-stopped
    depends_on:
      - main-backend
      - installer-service
      - selfheal-frontend
      - ai-backend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - captone-network

  # ==========================================
# Volumes & Networks
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  captone-network:
    driver: bridge
