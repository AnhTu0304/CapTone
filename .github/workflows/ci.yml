name: SelfHeal Monorepo CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Path Filtering: Chỉ kích hoạt CI cho đúng Service có thay đổi mã nguồn
  # ============================================================================
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      main_backend: ${{ steps.filter.outputs.main_backend }}
      ai_backend: ${{ steps.filter.outputs.ai_backend }}
      agent: ${{ steps.filter.outputs.agent }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check modified paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            main_backend:
              - 'Main_backend/**'
              - '.github/workflows/ci.yml'
            ai_backend:
              - 'AI_backend/**'
              - 'trainGRU/**'
              - '.github/workflows/ci.yml'
            agent:
              - 'Agent/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'Frontend/**'
              - '.github/workflows/ci.yml'

  # ============================================================================
  # 2. Docker Compose Validation: Đảm bảo cú pháp & đường dẫn hợp lệ trên Linux
  # ============================================================================
  docker-compose-check:
    name: Validate Docker Compose (Linux Case-Sensitivity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml and docker-compose.prod.yml syntax
        env:
          DB_PASSWORD: ci_dummy_db_password
          JWT_SECRET: ci_dummy_jwt_secret_minimum_32_characters_long
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
          test -d ./Main_backend
          test -d ./AI_backend
          test -d ./Frontend
          test -d ./Agent/installer_service
          test -d ./nginx

  # ============================================================================
  # 3. Main Backend CI: Node.js 22 + PostgreSQL 16 + Redis 7 + Migrations + Test
  # ============================================================================
  main-backend:
    name: Main Backend (Node.js TS + Postgres + Redis)
    needs: changes
    if: ${{ needs.changes.outputs.main_backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: captone_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d captone_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    defaults:
      run:
        working-directory: Main_backend

    env:
      NODE_ENV: test
      PORT: 5000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres_ci_password
      DB_NAME: captone_db
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long_99999
      OTEL_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Main_backend/package-lock.json

      - name: Install dependencies (Strict lockfile check)
        run: npm ci

      - name: Compile TypeScript (Type-check & Build)
        run: npm run build

      - name: Execute PostgreSQL SQL Migrations
        run: npm run migrate:users

      - name: Run Backend Test Suite (Incident & Report Models)
        run: npm run test:ci

  # ============================================================================
  # 4. AI Backend CI: Python 3.12 + CPU PyTorch + GRU & RCA Pytest
  # ============================================================================
  ai-backend:
    name: AI Backend (FastAPI GRU + Deterministic RCA)
    needs: changes
    if: ${{ needs.changes.outputs.ai_backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AI_backend

    env:
      PYTHONPATH: .
      APP_ENV: test
      GRU_MODEL_PATH: saved_models/gru_model_8feature.pth
      OTEL_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: AI_backend/requirements.txt

      - name: Install CPU PyTorch and AI Backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run GRU Prediction & RCA Pytest Suite
        run: pytest -q

  # ============================================================================
  # 5. K8s Agent & Installer Service CI: Python 3.11 + Pytest
  # ============================================================================
  agent:
    name: K8s Agent & Installer Service (Python 3.11)
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            Agent/requirements.txt
            Agent/installer_service/requirements.txt

      - name: Install Agent & Installer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Agent/requirements.txt
          pip install -r Agent/installer_service/requirements.txt

      - name: Run SelfHeal K8s Agent Pytest Suite
        working-directory: Agent
        env:
          PYTHONPATH: .
        run: pytest tests -q

      - name: Run Installer Service Pytest Suite
        working-directory: Agent/installer_service
        env:
          PYTHONPATH: ..
        run: pytest tests -q

  # ============================================================================
  # 6. Frontend CI: Node.js 20 + React 19 Production Build
  # ============================================================================
  frontend:
    name: Frontend (React 19 Build & Smoke Check)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Production Bundle
        env:
          # react-scripts treats unused-var ESLint warnings as fatal errors when CI=true (GitHub Actions default)
          CI: "false"
        run: npm run build
