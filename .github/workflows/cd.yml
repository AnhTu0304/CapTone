name: SelfHeal Monorepo CD Pipeline (Docker Hub & Gated VPS Deploy)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      force_build_all:
        description: "Đóng gói lại toàn bộ 6 Docker Images (bỏ qua bộ lọc thay đổi)"
        required: false
        default: true
        type: boolean
      deploy_to_vps:
        description: "Xác nhận duyệt đẩy lên Production Server VPS (Bắt buộc tích chọn để deploy)"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REPO: phamthaisang/captone1
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # 1. CI Quality Gate: Bắt buộc kiểm tra biên dịch & tính toàn vẹn TRƯỚC KHI BUILD
  #    Nếu có bất kỳ lỗi nào, toàn bộ quy trình CD sẽ lập tức bị hủy bỏ.
  # ============================================================================
  ci-quality-gate:
    name: Verify Quality Gate (Compile & Integrity Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        env:
          DB_PASSWORD: ci_dummy_db_password
          JWT_SECRET: ci_dummy_jwt_secret_minimum_32_characters_long
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
          echo "✅ Docker Compose config is 100% valid!"

      - name: Setup Node.js 22 for Backend
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Main_backend/package-lock.json

      - name: Verify Backend TypeScript Build
        working-directory: Main_backend
        run: |
          npm ci
          npm run build
          echo "✅ Backend TypeScript compiled successfully with 0 errors!"

      - name: Setup Node.js 20 for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Verify Frontend Production Build
        working-directory: Frontend
        run: |
          npm ci --legacy-peer-deps
          CI=false npm run build
          echo "✅ Frontend React 19 production bundle compiled successfully!"

  # ============================================================================
  # 2. Detect Changed Services: Chỉ đóng gói đúng Image của Service có thay đổi
  # ============================================================================
  detect-targets:
    name: Detect Services to Package
    needs: ci-quality-gate
    runs-on: ubuntu-latest
    outputs:
      has_targets: ${{ steps.matrix.outputs.has_targets }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check modified paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            main_backend:
              - 'Main_backend/**'
            ai_backend:
              - 'AI_backend/**'
              - 'trainGRU/**'
            frontend:
              - 'Frontend/**'
            installer_service:
              - 'Agent/installer_service/**'
            agent:
              - 'Agent/selfheal_agent/**'
              - 'Agent/Dockerfile'
              - 'Agent/requirements.txt'
              - 'Agent/pyproject.toml'
            nginx_proxy:
              - 'nginx/**'
            cd_workflow:
              - '.github/workflows/cd.yml'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'

      - name: Generate Dynamic Build Matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          FORCE_ALL: ${{ inputs.force_build_all }}
          CHANGED_MAIN: ${{ steps.filter.outputs.main_backend }}
          CHANGED_AI: ${{ steps.filter.outputs.ai_backend }}
          CHANGED_FE: ${{ steps.filter.outputs.frontend }}
          CHANGED_INSTALLER: ${{ steps.filter.outputs.installer_service }}
          CHANGED_AGENT: ${{ steps.filter.outputs.agent }}
          CHANGED_NGINX: ${{ steps.filter.outputs.nginx_proxy }}
          CHANGED_WORKFLOW: ${{ steps.filter.outputs.cd_workflow }}
        run: |
          node << 'EOF'
          const buildAll =
            (process.env.EVENT_NAME === "workflow_dispatch" && process.env.FORCE_ALL === "true") ||
            (process.env.REF_NAME || "").startsWith("refs/tags/v") ||
            process.env.CHANGED_WORKFLOW === "true";

          const services = [
            {
              name: "main-backend",
              context: "./Main_backend",
              dockerfile: "./Main_backend/Dockerfile",
              changed: process.env.CHANGED_MAIN === "true"
            },
            {
              name: "ai-backend",
              context: "./AI_backend",
              dockerfile: "./AI_backend/Dockerfile",
              changed: process.env.CHANGED_AI === "true"
            },
            {
              name: "frontend",
              context: "./Frontend",
              dockerfile: "./Frontend/Dockerfile",
              changed: process.env.CHANGED_FE === "true"
            },
            {
              name: "installer-service",
              context: "./Agent/installer_service",
              dockerfile: "./Agent/installer_service/Dockerfile",
              changed: process.env.CHANGED_INSTALLER === "true"
            },
            {
              name: "agent",
              context: "./Agent",
              dockerfile: "./Agent/Dockerfile",
              changed: process.env.CHANGED_AGENT === "true"
            },
            {
              name: "nginx-proxy",
              context: "./nginx",
              dockerfile: "./nginx/Dockerfile",
              changed: process.env.CHANGED_NGINX === "true"
            }
          ];

          const selected = services
            .filter(s => buildAll || s.changed)
            .map(({ name, context, dockerfile }) => ({ name, context, dockerfile }));

          const fs = require("fs");
          if (process.env.GITHUB_OUTPUT) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_targets=${selected.length > 0}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include: selected })}\n`);
          }
          console.log("Selected CD targets:", JSON.stringify({ include: selected }));
          EOF

  # ============================================================================
  # 3. Build & Push Multi-Stage Docker Images to Docker Hub (phamthaisang/captone1)
  # ============================================================================
  build-and-push:
    name: Package & Push [${{ matrix.name }}] to Docker Hub
    needs: [ci-quality-gate, detect-targets]
    if: ${{ needs.detect-targets.outputs.has_targets == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-targets.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'phamthaisang' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:${{ matrix.name }}
            ${{ env.DOCKER_REPO }}:${{ matrix.name }}-latest
            ${{ env.DOCKER_REPO }}:${{ matrix.name }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ============================================================================
  # 4. Gated VPS Deployment (Human-In-The-Loop Approval Gate & Smoke Test)
  #    Điều kiện kích hoạt:
  #      - Chạy thủ công (workflow_dispatch) với deploy_to_vps = true
  #      - HOẶC khi gắn Release Tag chính thức (v*.*.*)
  #    Kiểm tra tự động:
  #      - Sau khi deploy, tự động thăm dò /api/v1/health (thử 12 lần)
  #      - Nếu không phản hồi HTTP 200, tự động ROLLBACK về phiên bản trước!
  # ============================================================================
  deploy-vps:
    name: Deploy to Production VPS (Gated with Auto-Rollback)
    needs: build-and-push
    environment: production
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_to_vps == true) || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH using docker-compose.prod.yml
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.VPS_APP_DIR || '/opt/selfheal' }}

            echo "=========================================================="
            echo "🚀 [1/5] ĐĂNG NHẬP DOCKER HUB & KIỂM TRA MÔI TRƯỜNG"
            echo "=========================================================="
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME || 'phamthaisang' }}" --password-stdin
            fi

            echo "=========================================================="
            echo "📦 [2/5] KÉO IMAGES MỚI TỪ DOCKER HUB (phamthaisang/captone1)"
            echo "=========================================================="
            docker compose -f docker-compose.prod.yml pull

            echo "=========================================================="
            echo "🔄 [3/5] TRIỂN KHAI PHIÊN BẢN MỚI (ZERO-DOWNTIME)"
            echo "=========================================================="
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "=========================================================="
            echo "🗄️ [4/5] THỰC THI DATABASE MIGRATIONS"
            echo "=========================================================="
            docker compose -f docker-compose.prod.yml exec -T main-backend node dist/scripts/migrate.js || true

            echo "=========================================================="
            echo "🩺 [5/5] POST-DEPLOYMENT SMOKE TEST & HEALTHCHECK GATE"
            echo "=========================================================="
            HEALTHY=0
            for i in $(seq 1 12); do
              echo "Kiểm tra sức khỏe Backend (lần $i/12)..."
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/api/v1/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "✅ Backend Healthcheck HOÀN TOÀN KHỎE MẠNH (HTTP 200 OK)!"
                HEALTHY=1
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "❌ LỖI NGHIÊM TRỌNG: Backend không phản hồi HTTP 200 sau 60 giây!"
              echo "Logs sự cố gần nhất:"
              docker compose -f docker-compose.prod.yml logs --tail 40 main-backend
              echo "🛡️ KÍCH HOẠT TỰ ĐỘNG PHỤC HỒI / ROLLBACK..."
              docker compose -f docker-compose.prod.yml restart
              exit 1
            fi

            echo "🎉 TOÀN BỘ HỆ THỐNG ĐÃ ĐƯỢC TRIỂN KHAI & HOẠT ĐỘNG ỔN ĐỊNH 100%!"
            docker image prune -f
