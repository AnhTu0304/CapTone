# ============================================================================
# Production Docker Compose (Pulls pre-built images from Docker Hub)
# Sử dụng trên VPS / Production:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: captone-postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/postgresql/certs/server.crt"
      - "-c"
      - "ssl_key_file=/etc/postgresql/certs/server.key"
      - "-c"
      - "ssl_ca_file=/etc/postgresql/certs/ca.crt"
      - "-c"
      - "ssl_min_protocol_version=TLSv1.2"
      - "-c"
      - "hba_file=/etc/postgresql/certs/pg_hba.conf"
    environment:
      POSTGRES_USER: ${DB_MIGRATOR_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-captone_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${PG_CERTS_DIR:-./certs/postgres}:/etc/postgresql/certs:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "PGSSLMODE=verify-full PGSSLROOTCERT=/etc/postgresql/certs/ca.crt pg_isready -h 127.0.0.1 -U ${DB_MIGRATOR_USER:-postgres} -d ${DB_NAME:-captone_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - captone-network

  redis:
    image: redis:7-alpine
    container_name: captone-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - captone-network

  main-backend:
    image: ${DOCKER_IMAGE_PREFIX:-phamthaisang/captone1}:main-backend
    container_name: captone-main-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      API_PREFIX: /api/v1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-selfheal_app}
      DB_PASSWORD: ${DB_APP_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD must be set in .env}}
      DB_NAME: ${DB_NAME:-captone_db}
      DB_SSL_MODE: ${DB_SSL_MODE:-verify-full}
      DB_SSL_CA_PATH: ${DB_SSL_CA_PATH:-/etc/postgresql/certs/ca.crt}
      DB_SSL_REQUIRE_STRICT: ${DB_SSL_REQUIRE_STRICT:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-300}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      AI_BACKEND_URL: http://ai-backend:8000
      AI_INTERNAL_HMAC_SECRET: ${AI_INTERNAL_HMAC_SECRET:?AI_INTERNAL_HMAC_SECRET (min 32 chars) must be set in .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY (min 32 chars) must be set in .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY (min 32 chars) must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET (min 32 chars) must be set in .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER (min 32 chars) must be set in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://demo.giahungtrieu.net,https://localhost}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-"AI Self-Heal Support" <noreply@selfheal.io>}
      CLIENT_URL: ${CLIENT_URL:-https://demo.giahungtrieu.net}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-selfheal-backend}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-1.0.0}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-selfheal-system}
      DEPLOYMENT_ENVIRONMENT: production
    volumes:
      - ${PG_CA_CERT_FILE:-./certs/postgres/ca.crt}:/etc/postgresql/certs/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - captone-network

  ai-backend:
    image: ${DOCKER_IMAGE_PREFIX:-phamthaisang/captone1}:ai-backend
    container_name: captone-ai-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: 8000
      APP_ENV: production
      AI_INTERNAL_HMAC_SECRET: ${AI_INTERNAL_HMAC_SECRET:?AI_INTERNAL_HMAC_SECRET (min 32 chars) must be set in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: selfheal-ai-service
      OTEL_SERVICE_VERSION: "1.0.0"
      OTEL_SERVICE_NAMESPACE: selfheal-system
      DEPLOYMENT_ENVIRONMENT: production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - captone-network

  selfheal-frontend:
    image: ${DOCKER_IMAGE_PREFIX:-phamthaisang/captone1}:frontend
    container_name: selfheal_platform_web
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - captone-network

  installer-service:
    image: ${DOCKER_IMAGE_PREFIX:-phamthaisang/captone1}:installer-service
    container_name: captone-installer-service
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: 8100
      HOST: 0.0.0.0
      APP_ENV: production
      AGENT_VERSION: "1.0.0"
      DOCKER_IMAGE: "${DOCKER_IMAGE_PREFIX:-phamthaisang/captone1}:agent"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - captone-network

  nginx-proxy:
    image: ${DOCKER_IMAGE_PREFIX:-phamthaisang/captone1}:nginx-proxy
    container_name: captone-reverse-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - main-backend
      - installer-service
      - selfheal-frontend
      - ai-backend
    ports:
      - "${WEB_PORT:-8090}:80"
      - "443:443"
    volumes:
      - ${EDGE_CERTS_DIR:-./certs/edge}:/etc/nginx/certs:ro
    networks:
      - captone-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  captone-network:
    driver: bridge
