# Copy this template to k8s/secrets.local.yaml (do NOT commit real secrets),
# replace placeholders with strong random credentials, and run: kubectl apply -f k8s/secrets.local.yaml
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: captone
type: Opaque
stringData:
  DB_USER: "selfheal_app"
  DB_PASSWORD: "REPLACE_WITH_STRONG_APP_ROLE_PASSWORD"
  DB_MIGRATOR_USER: "selfheal_migrator"
  DB_MIGRATOR_PASSWORD: "REPLACE_WITH_STRONG_MIGRATOR_PASSWORD"
  REDIS_PASSWORD: "REPLACE_WITH_STRONG_REDIS_PASSWORD"
  JWT_SECRET: "REPLACE_WITH_MIN_32_CHAR_RANDOM_JWT_SECRET"
  REFRESH_TOKEN_PEPPER: "REPLACE_WITH_MIN_32_CHAR_RANDOM_PEPPER"
  AI_INTERNAL_HMAC_SECRET: "REPLACE_WITH_MIN_32_CHAR_RANDOM_HMAC_SECRET"
  TOTP_ENCRYPTION_KEY: "REPLACE_WITH_MIN_32_CHAR_RANDOM_TOTP_KEY"
  DATA_ENCRYPTION_KEY: "REPLACE_WITH_MIN_32_CHAR_RANDOM_DATA_KEY"
---
# Provision internal CA + server cert via ./scripts/certs/generate-pg-certs.sh and create:
# kubectl create secret generic postgres-tls-secret -n captone --from-file=ca.crt --from-file=server.crt --from-file=server.key --from-file=pg_hba.conf
apiVersion: v1
kind: Secret
metadata:
  name: postgres-tls-secret
  namespace: captone
type: Opaque
stringData:
  ca.crt: "REPLACE_WITH_CA_PEM"
  server.crt: "REPLACE_WITH_SERVER_CERT_PEM"
  server.key: "REPLACE_WITH_SERVER_PRIVATE_KEY_PEM"
  pg_hba.conf: "hostnossl all all all reject\nhostssl all all 0.0.0.0/0 scram-sha-256"
