apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: captone
data:
  PORT: "5000"
  NODE_ENV: "production"
  API_PREFIX: "/api/v1"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "captone_db"
  DB_USER: "postgres"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "selfheal-backend"
  OTEL_SERVICE_VERSION: "1.0.0"
  OTEL_SERVICE_NAMESPACE: "selfheal-system"
  DEPLOYMENT_ENVIRONMENT: "production"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318"
  OTEL_METRIC_EXPORT_INTERVAL_MS: "15000"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: captone
type: Opaque
stringData:
  DB_PASSWORD: "postgres"
  JWT_SECRET: "super_secret_jwt_key_development_only"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-backend-deployment
  namespace: captone
  labels:
    app: main-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-backend
  template:
    metadata:
      labels:
        app: main-backend
    spec:
      containers:
        - name: main-backend
          image: captone-main-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          env:
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: main-backend-service
  namespace: captone
  labels:
    app: main-backend
spec:
  type: NodePort # Hoặc ClusterIP / LoadBalancer tùy môi trường
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
      protocol: TCP
      name: http
  selector:
    app: main-backend
