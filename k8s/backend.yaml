apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: captone
data:
  PORT: "5000"
  NODE_ENV: "production"
  API_PREFIX: "/api/v1"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "captone_db"
  DB_USER: "selfheal_app"
  DB_SSL_MODE: "verify-full"
  DB_SSL_CA_PATH: "/etc/postgresql/certs/ca.crt"
  DB_SSL_REQUIRE_STRICT: "true"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_ENABLED: "true"
  JWT_ACCESS_EXPIRES_IN: "15m"
  COOKIE_SECURE: "true"
  TRUST_PROXY_HOPS: "1"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "selfheal-backend"
  OTEL_SERVICE_VERSION: "1.0.0"
  OTEL_SERVICE_NAMESPACE: "selfheal-system"
  DEPLOYMENT_ENVIRONMENT: "production"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318"
  OTEL_METRIC_EXPORT_INTERVAL_MS: "15000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-backend-deployment
  namespace: captone
  labels:
    app: main-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-backend
  template:
    metadata:
      labels:
        app: main-backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: main-backend
          image: captone-main-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          env:
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/postgresql/certs
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: postgres-tls-secret
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: main-backend-service
  namespace: captone
  labels:
    app: main-backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: main-backend
