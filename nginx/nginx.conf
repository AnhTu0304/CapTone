worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Map for WebSocket Upgrade header handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream service targets within Docker Compose network
    upstream frontend_svc {
        server selfheal-frontend:80;
    }

    upstream main_backend_svc {
        server main-backend:5000;
    }

    upstream ai_backend_svc {
        server ai-backend:8000;
    }

    upstream installer_svc {
        server installer-service:8100;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Healthcheck endpoint for load balancers / cloud probes
        location /healthz {
            return 200 '{"status":"ok","proxy":"nginx-reverse-proxy"}';
            add_header Content-Type application/json;
        }

        # 1. CapTone Agent Distribution & Installer API
        # Serves: /agent/install.sh, /agent/install.ps1, /agent/checksums, /agent/info
        location /agent/ {
            proxy_pass http://installer_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # 2. WebSocket Protocol for Agent Connection & UI Telemetry
        location /api/v1/telemetry/ws {
            proxy_pass http://main_backend_svc/api/v1/telemetry/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        location /api/v1/agent/connect {
            proxy_pass http://main_backend_svc/api/v1/agent/connect;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for long-lived WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # 3. Main Backend REST API
        location /api/ {
            proxy_pass http://main_backend_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. AI Prediction & RCA Backend API
        location /ai/ {
            proxy_pass http://ai_backend_svc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Frontend React SPA
        location / {
            proxy_pass http://frontend_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
