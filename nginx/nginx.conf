worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50M;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/m;

    # Map for WebSocket Upgrade header handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream service targets within Docker Compose network
    upstream frontend_svc {
        server selfheal-frontend:80;
    }

    upstream main_backend_svc {
        server main-backend:5000;
    }

    upstream installer_svc {
        server installer-service:8100;
    }

    # Port 80: Healthcheck + Permanent HTTPS Redirect
    server {
        listen 80;
        listen [::]:80;
        server_name demo.giahungtrieu.net 112.78.1.150 localhost _;

        include /etc/nginx/snippets/security-headers.conf;

        location /healthz {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Content-Type application/json always;
            return 200 '{"status":"ok","proxy":"nginx-reverse-proxy"}';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Port 443: Edge HTTPS + WSS Termination
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name demo.giahungtrieu.net 112.78.1.150 localhost _;

        ssl_certificate /etc/nginx/certs/edge.crt;
        ssl_certificate_key /etc/nginx/certs/edge.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        include /etc/nginx/snippets/security-headers.conf;

        location /healthz {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Content-Type application/json always;
            return 200 '{"status":"ok","proxy":"nginx-reverse-proxy","tls":"enabled"}';
        }

        # 1. CapTone Agent Distribution & Installer API
        location /agent/ {
            proxy_pass http://installer_svc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # 2. WebSocket Protocol (WSS terminated at Edge -> internal HTTP upgrade)
        location /api/v1/telemetry/ws {
            proxy_pass http://main_backend_svc/api/v1/telemetry/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        location /api/v1/agent/connect {
            proxy_pass http://main_backend_svc/api/v1/agent/connect;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # 3. Main Backend Auth API (tighter rate limit)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://main_backend_svc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 4. Main Backend REST API
        location /api/ {
            proxy_pass http://main_backend_svc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 5. Frontend React SPA
        location / {
            proxy_pass http://frontend_svc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
