[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfheal-agent"
version = "1.0.0"
description = "SelfHeal AI-Driven Proactive Self-Healing Infrastructure Agent for Kubernetes"
authors = [{ name = "SelfHeal Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kubernetes>=31.0.0",
    "websockets>=14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "aiohttp>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
selfheal-agent = "selfheal_agent.main:run_main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
