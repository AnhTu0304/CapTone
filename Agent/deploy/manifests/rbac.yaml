apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: selfheal-agent-role
  labels:
    app.kubernetes.io/name: selfheal-agent
    app.kubernetes.io/component: monitoring-agent
rules:
  # Least Privilege: Read & Remediation access to Core resources for metrics, logs & pod healing
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "namespaces", "events", "nodes"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  # Workload metadata & remediation for Deployments and ReplicaSets
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Horizontal scale remediation
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  # Kubernetes Metrics Server access
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: selfheal-agent-rolebinding
  labels:
    app.kubernetes.io/name: selfheal-agent
    app.kubernetes.io/component: monitoring-agent
subjects:
  - kind: ServiceAccount
    name: selfheal-agent-sa
    namespace: selfheal-system
roleRef:
  kind: ClusterRole
  name: selfheal-agent-role
  apiGroup: rbac.authorization.k8s.io
