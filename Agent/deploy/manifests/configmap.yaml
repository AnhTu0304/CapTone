apiVersion: v1
kind: ConfigMap
metadata:
  name: selfheal-agent-config
  namespace: selfheal-system
  labels:
    app.kubernetes.io/name: selfheal-agent
data:
  AGENT_SERVER_URL: "ws://host.minikube.internal:5005/api/v1/agent/connect"
  AGENT_UID: "selfheal-agent-default"
  CLUSTER_ID: "fcb1a025-48f0-40bf-b9ea-c61af3448084"
  ENVIRONMENT_ID: "e0000000-0000-0000-0000-000000000001"
  METRICS_INTERVAL_MS: "5000"
  LOG_COLLECTION_INTERVAL_MS: "5000"
  K8S_NAMESPACE: "default"
  MONITOR_ALL_NAMESPACES: "true"
  LOG_LEVEL: "INFO"
  ENABLE_HEALING_ACTIONS: "true"
  HEALTH_PORT: "8080"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "selfheal-k8s-agent"
  OTEL_SERVICE_VERSION: "1.0.0"
  OTEL_SERVICE_NAMESPACE: "selfheal-system"
  DEPLOYMENT_ENVIRONMENT: "production"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318"
  OTEL_METRIC_EXPORT_INTERVAL_MS: "15000"
