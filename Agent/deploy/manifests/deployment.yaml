apiVersion: apps/v1
kind: Deployment
metadata:
  name: selfheal-agent
  namespace: selfheal-system
  labels:
    app.kubernetes.io/name: selfheal-agent
    app.kubernetes.io/component: monitoring-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: selfheal-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: selfheal-agent
    spec:
      serviceAccountName: selfheal-agent-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: selfheal-agent
          image: captone-agent:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-health
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: selfheal-agent-config
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: selfheal-agent-secret
                  key: AGENT_TOKEN
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
