image:
  repository: selfheal-agent
  tag: "1.0.0"
  pullPolicy: IfNotPresent

config:
  agentServerUrl: "wss://backend.captone.local/api/v1/agent/connect"
  agentUid: "selfheal-agent-cluster-01"
  clusterId: ""
  environmentId: ""
  metricsIntervalMs: 5000
  logCollectionIntervalMs: 5000
  k8sNamespace: "default"
  monitorAllNamespaces: false
  logLevel: "info"

prometheus:
  enabled: false
  # URL of cluster Prometheus for RPS, latency, and 5xx telemetry
  url: "http://prometheus-k8s.monitoring.svc:9090"

secret:
  # Name of an existing secret containing 'AGENT_TOKEN'
  existingSecret: ""
  # Or provide the token directly during helm install (will be stored in a k8s secret)
  agentToken: ""

serviceAccount:
  create: true
  name: "selfheal-agent-sa"

rbac:
  create: true

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
