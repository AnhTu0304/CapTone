{{- if and (not .Values.secret.existingSecret) .Values.secret.agentToken -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "selfheal-agent.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "selfheal-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  AGENT_TOKEN: {{ .Values.secret.agentToken | quote }}
{{- end }}
