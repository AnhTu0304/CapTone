apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: selfheal-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: selfheal-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: selfheal-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        {{- if .Values.securityContext.runAsGroup }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        {{- end }}
        {{- if .Values.securityContext.fsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        {{- end }}
      containers:
        - name: selfheal-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http-health
              containerPort: 8080
              protocol: TCP
          env:
            - name: AGENT_SERVER_URL
              value: {{ .Values.config.agentServerUrl | quote }}
            - name: AGENT_UID
              value: {{ .Values.config.agentUid | quote }}
            - name: CLUSTER_ID
              value: {{ .Values.config.clusterId | quote }}
            - name: ENVIRONMENT_ID
              value: {{ .Values.config.environmentId | quote }}
            - name: METRICS_INTERVAL_MS
              value: {{ .Values.config.metricsIntervalMs | quote }}
            - name: LOG_COLLECTION_INTERVAL_MS
              value: {{ .Values.config.logCollectionIntervalMs | quote }}
            - name: K8S_NAMESPACE
              value: {{ .Values.config.k8sNamespace | quote }}
            - name: MONITOR_ALL_NAMESPACES
              value: {{ .Values.config.monitorAllNamespaces | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: HEALTH_PORT
              value: "8080"
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- if and .Values.prometheus .Values.prometheus.enabled }}
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            {{- end }}
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secret" .Release.Name) .Values.secret.existingSecret }}
                  key: AGENT_TOKEN
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
