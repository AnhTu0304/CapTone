apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "selfheal-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "selfheal-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "selfheal-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "selfheal-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "selfheal-agent.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        {{- if .Values.securityContext.runAsGroup }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        {{- end }}
        {{- if .Values.securityContext.fsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        {{- end }}
        {{- if .Values.securityContext.seccompProfile }}
        seccompProfile:
          {{- toYaml .Values.securityContext.seccompProfile | nindent 10 }}
        {{- end }}
      containers:
        - name: selfheal-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http-health
              containerPort: 8080
              protocol: TCP
          env:
            - name: AGENT_SERVER_URL
              value: {{ .Values.config.agentServerUrl | quote }}
            - name: AGENT_UID
              value: {{ .Values.config.agentUid | quote }}
            - name: CLUSTER_ID
              value: {{ .Values.config.clusterId | quote }}
            - name: ENVIRONMENT_ID
              value: {{ .Values.config.environmentId | quote }}
            - name: METRICS_INTERVAL_MS
              value: {{ .Values.config.metricsIntervalMs | quote }}
            - name: LOG_COLLECTION_INTERVAL_MS
              value: {{ .Values.config.logCollectionIntervalMs | quote }}
            - name: K8S_NAMESPACE
              value: {{ .Values.config.k8sNamespace | quote }}
            - name: MONITOR_ALL_NAMESPACES
              value: {{ .Values.config.monitorAllNamespaces | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ENABLE_HEALING_ACTIONS
              value: {{ .Values.config.enableHealingActions | default false | quote }}
            - name: HEALTH_PORT
              value: "8080"
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- if and .Values.prometheus .Values.prometheus.enabled }}
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            {{- end }}
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secret" (include "selfheal-agent.fullname" .)) .Values.secret.existingSecret }}
                  key: AGENT_TOKEN
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.containerSecurityContext.readOnlyRootFilesystem }}
            {{- if .Values.containerSecurityContext.capabilities }}
            capabilities:
              {{- toYaml .Values.containerSecurityContext.capabilities | nindent 14 }}
            {{- end }}
          {{- if .Values.containerSecurityContext.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if .Values.containerSecurityContext.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
